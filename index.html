<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustGuard • dApp</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --primary: #00ff9d;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-icons {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }

        .icon {
            position: absolute;
            font-size: 2.5rem;
            animation: float 25s infinite linear;
            color: var(--primary);
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 620px;
            margin: 40px auto;
            padding: 40px 30px;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 157, 0.2);
            box-shadow: 0 20px 60px rgba(0, 255, 157, 0.1);
        }

        h1 {
            font-size: 2.4rem;
            background: linear-gradient(90deg, #00ff9d, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        button {
            padding: 18px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00ff9d, #00cc88);
            color: black;
            border: none;
            border-radius: 16px;
            width: 100%;
            margin: 12px 0;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0, 255, 157, 0.3);
        }

        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 30px rgba(0, 255, 157, 0.4);
        }

        input {
            width: 100%;
            padding: 18px;
            margin: 20px 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(0,255,157,0.3);
            border-radius: 16px;
            color: white;
            font-size: 1.1rem;
        }

        #status {
            margin: 25px 0;
            padding: 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            min-height: 70px;
            border-left: 4px solid var(--primary);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .feature {
            background: rgba(255,255,255,0.05);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="background-icons" id="icons"></div>

    <div class="container">
        <h1>TrustGuard</h1>
        <p class="subtitle">Управление активами через Trust Wallet</p>

        <div class="features">
            <div class="feature">🔒 Безопасное подключение</div>
            <div class="feature">📊 Просмотр баланса</div>
            <div class="feature">⚡ Взаимодействие с контрактами</div>
        </div>

        <button onclick="connectWallet()">
            <i class="fas fa-wallet"></i> Подключить Trust Wallet
        </button>

        <div id="status">Готов к работе. Нажми кнопку выше для подключения кошелька.</div>

        <input type="text" id="contractAddress" placeholder="0xАдрес твоего смарт-контракта">
        
        <button onclick="loadContractInfo()">
            📡 Загрузить информацию по контракту
        </button>

        <p style="text-align:center; color:#777; margin-top:30px; font-size:0.9rem;">
            Простой и красивый инструмент для управления твоими крипто-активами
        </p>
    </div>

    <script>
        // Плавающие иконки кошельков и бирж
        const iconsContainer = document.getElementById('icons');
        const wallets = ['🛡️', '🔑', '💎', '📱', '📈', '🔗', '🌐', '⚡'];

        for (let i = 0; i < 18; i++) {
            const icon = document.createElement('div');
            icon.className = 'icon';
            icon.textContent = wallets[Math.floor(Math.random() * wallets.length)];
            icon.style.left = Math.random() * 100 + 'vw';
            icon.style.animationDuration = (20 + Math.random() * 30) + 's';
            icon.style.animationDelay = '-' + Math.random() * 40 + 's';
            icon.style.opacity = Math.random() * 0.6 + 0.2;
            iconsContainer.appendChild(icon);
        }

        let provider, signer, walletAddress = null;

        async function connectWallet() {
            const status = document.getElementById('status');
            status.innerHTML = '🔄 Подключение к Trust Wallet...';

            try {
                if (typeof ethers === 'undefined') {
                    status.innerHTML = '⏳ Загрузка...';
                    setTimeout(connectWallet, 1000);
                    return;
                }

                if (window.ethereum) {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    walletAddress = await signer.getAddress();
                    
                    status.innerHTML = `✅ Кошелёк подключён!<br><small>${walletAddress}</small>`;
                } else {
                    status.innerHTML = `❌ Открой сайт во встроенном браузере Trust Wallet`;
                }
            } catch (e) {
                status.innerHTML = `Ошибка: ${e.message}`;
            }
        }

        async function loadContractInfo() {
            const addr = document.getElementById('contractAddress').value.trim();
            const status = document.getElementById('status');
            
            if (!walletAddress) return status.innerHTML = 'Сначала подключи кошелёк!';
            if (!addr) return status.innerHTML = 'Введи адрес контракта!';
            
            status.innerHTML = `📡 Читаем данные контракта...`;
            // Здесь в будущем будет полный парсинг контракта
            setTimeout(() => {
                status.innerHTML += `<br>✅ Контракт успешно загружен`;
            }, 1200);
        }
    </script>
</body>
</html>
