<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Wallet dApp</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background:#0f0f0f; color:#fff; margin:0; padding:20px; }
        .container { max-width: 600px; margin:auto; background:#1a1a1a; padding:30px; border-radius:16px; text-align:center; }
        button { padding:16px 32px; font-size:18px; background:#00cc66; color:white; border:none; border-radius:12px; width:100%; margin:10px 0; }
        #status { margin:20px 0; padding:15px; background:#222; border-radius:10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔗 Подключение к dApp</h1>
        <p>Открыто внутри Trust Wallet</p>
        
        <button onclick="connectWallet()">Подключить Trust Wallet</button>
        
        <div id="status"></div>
        
        <input type="text" id="contractAddress" placeholder="0xАдрес смарт-контракта" style="width:100%; padding:14px; margin:15px 0; background:#333; border:none; border-radius:8px; color:white;">
        <button onclick="loadContractInfo()">Загрузить данные контракта</button>
    </div>

    <script>
        let provider, signer, walletAddress = null;

        async function connectWallet() {
            const status = document.getElementById('status');
            status.innerHTML = '🔄 Подключение...';

            try {
                if (window.ethereum) {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    walletAddress = await signer.getAddress();
                    status.innerHTML = `✅ Подключено!<br><small>${walletAddress}</small>`;
                } else {
                    status.innerHTML = `❌ Открой сайт внутри Trust Wallet Browser`;
                }
            } catch (e) {
                status.innerHTML = `Ошибка: ${e.message}`;
            }
        }

        async function loadContractInfo() {
            const addr = document.getElementById('contractAddress').value.trim();
            if (!walletAddress || !addr) {
                alert('Подключи кошелёк и введи адрес контракта');
                return;
            }
            alert('✅ Контракт подключён (добавим полную логику позже)');
            // Здесь будет код чтения контракта
        }
    </script>
</body>
</html>
