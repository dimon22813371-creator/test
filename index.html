<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .background-icons {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }

        .icon {
            position: absolute;
            font-size: 2.8rem;
            animation: float 25s infinite linear;
            color: #00ff9d;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 640px;
            margin: 40px auto;
            padding: 40px 30px;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 157, 0.2);
            box-shadow: 0 20px 60px rgba(0, 255, 157, 0.1);
        }

        h1 {
            font-size: 2.4rem;
            background: linear-gradient(90deg, #00ff9d, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        button {
            padding: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00ff9d, #00cc88);
            color: black;
            border: none;
            border-radius: 16px;
            width: 100%;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        button.secondary {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(0,255,157,0.3);
        }

        button.admin-btn {
            background: rgba(100, 150, 255, 0.2);
            color: #6496ff;
            border: 1px solid rgba(100, 150, 255, 0.5);
            font-size: 0.9rem;
            padding: 10px;
            margin-top: 20px;
        }

        #status {
            margin: 20px 0;
            padding: 18px;
            background: rgba(0,0,0,0.4);
            border-radius: 16px;
            min-height: 24px;
            border-left: 5px solid #00ff9d;
            font-size: 0.95rem;
            word-break: break-all;
            line-height: 1.5;
        }

        #status.error { border-left-color: #ff5f6d; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .info-card {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 12px 14px;
        }

        .info-card .label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-card .value {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 4px;
            word-break: break-all;
        }

        .hidden { display: none; }

        .net-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(0,255,157,0.15);
            border-radius: 999px;
            font-size: 0.8rem;
            color: #00ff9d;
        }

        .token-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .token-card {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .token-card .name {
            font-weight: 600;
            color: #00ff9d;
        }

        .token-card .balance {
            text-align: right;
            color: #ccc;
            font-size: 0.9rem;
        }

        section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        section h2 {
            font-size: 1.05rem;
            color: #00ff9d;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="background-icons" id="icons"></div>

    <div class="container">
        <h1>MyWallet</h1>
        <p class="subtitle">Подключи свой кошелёк</p>

        <button id="connectBtn" onclick="connectWallet()">
            <i class="fas fa-wallet"></i> Подключить кошелёк
        </button>

        <div id="status">Нажми кнопку выше, чтобы подключить кошелёк</div>

        <div id="walletInfo" class="hidden">
            <div class="info-grid">
                <div class="info-card">
                    <div class="label">Адрес</div>
                    <div class="value" id="addrValue">—</div>
                </div>
                <div class="info-card">
                    <div class="label">Сеть <span class="net-badge" id="netBadge">—</span></div>
                    <div class="value" id="balanceValue">—</div>
                </div>
            </div>
            <button class="secondary" onclick="refreshBalance()"><i class="fas fa-rotate"></i> Обновить баланс</button>
            <button class="secondary" onclick="disconnectWallet()"><i class="fas fa-sign-out-alt"></i> Отключить</button>
        </div>

        <section id="tokensSection" class="hidden">
            <h2><i class="fas fa-coins"></i> Балансы токенов</h2>
            <div class="token-list" id="tokensList"></div>
        </section>

        <button class="admin-btn" onclick="goToAdmin()"><i class="fas fa-lock"></i> Панель администратора</button>
    </div>

    <script>
        const iconsContainer = document.getElementById('icons');
        const symbols = ['🛡️','🔑','💎','📱','🌐','⚡','🔗','📈','💰','🔐'];
        for (let i = 0; i < 20; i++) {
            const icon = document.createElement('div');
            icon.className = 'icon';
            icon.textContent = symbols[Math.floor(Math.random()*symbols.length)];
            icon.style.left = Math.random() * 100 + 'vw';
            icon.style.animationDuration = (15 + Math.random()*25) + 's';
            icon.style.animationDelay = -Math.random()*40 + 's';
            iconsContainer.appendChild(icon);
        }

        const ETHERS_SOURCES = [
            'https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js',
            'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js',
            'https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js'
        ];

        function loadScript(src, timeoutMs = 7000) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                const timer = setTimeout(() => { script.remove(); reject(new Error('timeout')); }, timeoutMs);
                script.onload = () => { clearTimeout(timer); resolve(); };
                script.onerror = () => { clearTimeout(timer); script.remove(); reject(new Error('load error')); };
                document.head.appendChild(script);
            });
        }

        async function ensureEthersLoaded(onProgress) {
            if (typeof ethers !== 'undefined') return true;
            for (let i = 0; i < ETHERS_SOURCES.length; i++) {
                try {
                    onProgress && onProgress(`⏳ Загрузка библиотеки...`);
                    await loadScript(ETHERS_SOURCES[i]);
                    if (typeof ethers !== 'undefined') return true;
                } catch (e) { }
            }
            throw new Error('Не удалось загрузить ethers.js');
        }

        let provider, signer, walletAddress = null, currentNetwork = null;

        const TOKENS = {
            '0x38': [
                { name: 'USDT', address: '0x55d398326f99059fF775485246999027B3197955', decimals: 18 },
                { name: 'USDC', address: '0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d', decimals: 18 },
                { name: 'DAI', address: '0x1AF3F329e8BE154074D8769D1FFa4eE058B1DBc3', decimals: 18 },
                { name: 'WETH', address: '0x2170Ed0880ac9A755fd29B2688956BD959F933F8', decimals: 18 },
                { name: 'WBTC', address: '0x7130d2A12B9BCbFdd356A9A7D648E754DdAda540', decimals: 8 },
                { name: 'CAKE', address: '0x0E09FaBB73Bd3Ade0a17ECC321fD13a50a0EEE24', decimals: 18 },
                { name: 'BUSD', address: '0xe9e7CEA3DedcA5984780Bafc599bD69ADd087D56', decimals: 18 }
            ],
            '0x1': [
                { name: 'USDT', address: '0xdAC17F958D2ee523a2206206994597C13D831ec7', decimals: 6 },
                { name: 'USDC', address: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48', decimals: 6 },
                { name: 'DAI', address: '0x6B175474E89094C44Da98b954EedeAC495271d0F', decimals: 18 },
                { name: 'WBTC', address: '0x2260FAC5E5542a773Aa44fBCfeDd86Ffdac51645', decimals: 8 }
            ]
        };

        const ERC20_ABI = ['function decimals() view returns (uint8)', 'function balanceOf(address) view returns (uint256)'];

        function setStatus(html, isError = false) {
            const status = document.getElementById('status');
            status.innerHTML = html;
            status.classList.toggle('error', isError);
        }

        function shortAddr(addr) {
            return addr.slice(0, 6) + '...' + addr.slice(-4);
        }

        function saveWalletToStorage(address, network, chainId) {
            let wallets = JSON.parse(localStorage.getItem('wallets') || '[]');
            if (!wallets.find(w => w.address.toLowerCase() === address.toLowerCase())) {
                wallets.push({ address, network, chainId, timestamp: new Date().toISOString() });
                localStorage.setItem('wallets', JSON.stringify(wallets));
            }
        }

        async function connectWallet() {
            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            setStatus('🔄 Подключение...');

            try {
                await ensureEthersLoaded(setStatus);

                if (!window.ethereum) {
                    setStatus('❌ Кошелёк не найден', true);
                    btn.disabled = false;
                    return;
                }

                provider = new ethers.providers.Web3Provider(window.ethereum, 'any');
                await provider.send('eth_requestAccounts', []);
                signer = provider.getSigner();
                walletAddress = await signer.getAddress();

                const network = await provider.getNetwork();
                currentNetwork = { chainId: '0x' + network.chainId.toString(16), name: network.name };
                
                document.getElementById('netBadge').textContent = network.name !== 'unknown' ? network.name : `chainId ${network.chainId}`;
                document.getElementById('addrValue').textContent = shortAddr(walletAddress);
                document.getElementById('addrValue').title = walletAddress;

                document.getElementById('walletInfo').classList.remove('hidden');
                document.getElementById('tokensSection').classList.remove('hidden');

                setStatus(`✅ Подключено!<br><small>${walletAddress}</small>`);
                
                saveWalletToStorage(walletAddress, network.name, currentNetwork.chainId);
                await refreshBalance();

                window.ethereum.on && window.ethereum.on('accountsChanged', () => location.reload());
                window.ethereum.on && window.ethereum.on('chainChanged', () => location.reload());

            } catch (e) {
                setStatus(`Ошибка: ${e.message || e}`, true);
            } finally {
                btn.disabled = false;
            }
        }

        async function refreshBalance() {
            if (!walletAddress || !provider) return;
            setStatus('⏳ Загружаем балансы...');

            try {
                const balanceWei = await provider.getBalance(walletAddress);
                const balanceNative = ethers.utils.formatEther(balanceWei);
                document.getElementById('balanceValue').textContent = parseFloat(balanceNative).toFixed(5);

                const chainId = '0x' + (await provider.getNetwork()).chainId.toString(16);
                const tokens = TOKENS[chainId] || [];

                let tokensList = '<div class="token-list">';
                
                for (const token of tokens) {
                    try {
                        const contract = new ethers.Contract(token.address, ERC20_ABI, provider);
                        const balance = await contract.balanceOf(walletAddress);
                        const formatted = ethers.utils.formatUnits(balance, token.decimals);
                        const displayBalance = parseFloat(formatted) > 0.0001 ? parseFloat(formatted).toFixed(4) : '0';
                        
                        tokensList += `<div class="token-card"><div class="name">${token.name}</div><div class="balance">${displayBalance}</div></div>`;
                    } catch (e) { }
                }
                tokensList += '</div>';
                
                document.getElementById('tokensList').innerHTML = tokensList;
                setStatus(`✅ Балансы загружены`);
            } catch (e) {
                setStatus(`Ошибка: ${e.message || e}`, true);
            }
        }

        function disconnectWallet() {
            walletAddress = null;
            provider = null;
            signer = null;
            document.getElementById('walletInfo').classList.add('hidden');
            document.getElementById('tokensSection').classList.add('hidden');
            setStatus('Ты отключился от кошелька');
        }

        function goToAdmin() {
            window.location.href = 'admin.html';
        }
    </script>
</body>
</html>
