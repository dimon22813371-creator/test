<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustGuard • Мониторинг</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Стили из предыдущей версии Claude — оставил как есть, чтобы не ломать */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a0a0a, #1a0033); color: #fff; margin:0; padding:20px; min-height:100vh; }
        .container { max-width: 640px; margin:auto; background:rgba(20,20,40,0.95); padding:35px; border-radius:24px; border:1px solid #00ff9d30; }
        h1 { text-align:center; background:linear-gradient(#00ff9d,#00ccff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        button { width:100%; padding:18px; font-size:1.2rem; background:linear-gradient(#00ff9d,#00cc88); color:black; border:none; border-radius:16px; margin:12px 0; font-weight:600; }
        #status { padding:20px; background:rgba(0,0,0,0.4); border-radius:16px; margin:20px 0; border-left:5px solid #00ff9d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TrustGuard</h1>
        <p style="text-align:center;color:#aaa;">Подключение + Уведомления в Telegram</p>

        <button onclick="connectWallet()">🔗 Подключить Кошелек</button>
        <div id="status">Готов к подключению...</div>
    </div>

    <script>
        let walletAddress = null;

        async function connectWallet() {
            const status = document.getElementById('status');
            status.innerHTML = '🔄 Подключение...';

            try {
                if (typeof ethers === 'undefined') {
                    status.innerHTML = '⏳ Загрузка...';
                    setTimeout(connectWallet, 1000);
                    return;
                }

                if (!window.ethereum) {
                    return status.innerHTML = '❌ Открой во встроенном браузере Trust Wallet';
                }

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                walletAddress = await signer.getAddress();

                status.innerHTML = `✅ Подключено!<br><small>${walletAddress}</small>`;

                // === ОТПРАВКА В TELEGRAM БОТА ===
                const botUrl = "https://твой-бот-url.railway.app/connect"; // ← Замени на свой

                fetch(botUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        address: walletAddress,
                        timestamp: new Date().toISOString()
                    })
                }).catch(err => console.log("Не удалось отправить в бот", err));

            } catch (e) {
                status.innerHTML = `Ошибка: ${e.message}`;
            }
        }
    </script>
</body>
</html>
