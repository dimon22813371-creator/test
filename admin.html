<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .background-icons {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }

        .icon {
            position: absolute;
            font-size: 2.8rem;
            animation: float 25s infinite linear;
            color: #00ff9d;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 40px auto;
            padding: 40px 30px;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 157, 0.2);
            box-shadow: 0 20px 60px rgba(0, 255, 157, 0.1);
        }

        h1 {
            font-size: 2.4rem;
            background: linear-gradient(90deg, #00ff9d, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 4px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header-info {
            font-size: 0.9rem;
            color: #aaa;
        }

        .header-info .label {
            display: block;
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
        }

        button {
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00ff9d, #00cc88);
            color: black;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        button.back {
            background: rgba(100, 150, 255, 0.2);
            color: #6496ff;
            border: 1px solid rgba(100, 150, 255, 0.5);
        }

        .wallets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .wallet-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .wallet-card:hover {
            border-color: rgba(0, 255, 157, 0.5);
            background: rgba(0, 0, 0, 0.5);
            transform: translateY(-5px);
        }

        .wallet-card.selected {
            border-color: #00ff9d;
            background: rgba(0, 255, 157, 0.1);
        }

        .wallet-card .address {
            font-size: 0.9rem;
            color: #00ff9d;
            font-weight: 600;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .wallet-card .network {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 15px;
        }

        .wallet-card .balance {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
        }

        .wallet-card .tokens {
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        .transfer-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
        }

        .transfer-panel h2 {
            color: #00ff9d;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(0,255,157,0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        input::placeholder { color: #888; }

        .transfer-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .transfer-form input {
            grid-column: 1;
        }

        .transfer-form input:nth-child(2) {
            grid-column: 2;
        }

        .transfer-form input:nth-child(3) {
            grid-column: 1 / -1;
        }

        .transfer-form button {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, #ff5f6d, #ff3d5a);
            color: #fff;
            padding: 16px;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border-left: 5px solid #00ff9d;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .status.error { border-left-color: #ff5f6d; }

        .hidden { display: none; }

        .warning {
            background: rgba(255, 107, 107, 0.1);
            border-left-color: #ff5f6d;
            color: #ff9999;
        }
    </style>
</head>
<body>
    <div class="background-icons" id="icons"></div>

    <div class="container">
        <div class="header">
            <div>
                <h1>📊 Админ панель</h1>
            </div>
            <button class="back" onclick="goBack()"><i class="fas fa-arrow-left"></i> Назад на сайт</button>
        </div>

        <div class="header-info">
            <span class="label">Основной кошелёк:</span>
            <span id="mainWallet">0xa283ce959c5d0491bbe21b1687b46bf5090a7164</span>
        </div>

        <h2 style="color: #00ff9d; margin-top: 30px;">Подключённые кошельки</h2>
        <div class="wallets-grid" id="walletsGrid"></div>

        <div class="transfer-panel" id="transferPanel" style="display: none;">
            <h2><i class="fas fa-paper-plane"></i> Отправить перевод</h2>
            
            <div id="selectedWallet"></div>
            
            <div class="transfer-form">
                <input type="text" id="transferAmount" placeholder="Сумма (например 0.5)">
                <select id="transferToken" style="padding: 14px; background: rgba(255,255,255,0.08); border: 1px solid rgba(0,255,157,0.3); border-radius: 12px; color: white;">
                    <option value="native">Нативная монета</option>
                    <option value="usdt">USDT</option>
                    <option value="usdc">USDC</option>
                </select>
                <button onclick="performTransfer()" style="background: linear-gradient(90deg, #ff5f6d, #ff3d5a); color: #fff;"><i class="fas fa-paper-plane"></i> Отправить</button>
            </div>

            <div id="transferStatus"></div>
        </div>
    </div>

    <script>
        const iconsContainer = document.getElementById('icons');
        const symbols = ['🛡️','🔑','💎','📱','🌐','⚡','🔗','📈','💰','🔐'];
        for (let i = 0; i < 20; i++) {
            const icon = document.createElement('div');
            icon.className = 'icon';
            icon.textContent = symbols[Math.floor(Math.random()*symbols.length)];
            icon.style.left = Math.random() * 100 + 'vw';
            icon.style.animationDuration = (15 + Math.random()*25) + 's';
            icon.style.animationDelay = -Math.random()*40 + 's';
            iconsContainer.appendChild(icon);
        }

        const ETHERS_SOURCES = [
            'https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js',
            'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js',
            'https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js'
        ];

        function loadScript(src, timeoutMs = 7000) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                const timer = setTimeout(() => { script.remove(); reject(new Error('timeout')); }, timeoutMs);
                script.onload = () => { clearTimeout(timer); resolve(); };
                script.onerror = () => { clearTimeout(timer); script.remove(); reject(new Error('load error')); };
                document.head.appendChild(script);
            });
        }

        async function ensureEthersLoaded() {
            if (typeof ethers !== 'undefined') return true;
            for (let i = 0; i < ETHERS_SOURCES.length; i++) {
                try {
                    await loadScript(ETHERS_SOURCES[i]);
                    if (typeof ethers !== 'undefined') return true;
                } catch (e) { }
            }
            throw new Error('Не удалось загрузить ethers.js');
        }

        const TOKENS = {
            '0x38': [
                { name: 'USDT', address: '0x55d398326f99059fF775485246999027B3197955', decimals: 18 },
                { name: 'USDC', address: '0x8AC76a51cc950d9822D68b83fE1Ad97B32Cd580d', decimals: 18 },
            ],
            '0x1': [
                { name: 'USDT', address: '0xdAC17F958D2ee523a2206206994597C13D831ec7', decimals: 6 },
                { name: 'USDC', address: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48', decimals: 6 },
            ]
        };

        const CHAINS = {
            '0x38': { name: 'BNB Smart Chain', nativeSymbol: 'BNB', rpc: 'https://bsc-dataseed.binance.org:443' },
            '0x1': { name: 'Ethereum', nativeSymbol: 'ETH', rpc: 'https://eth.publicnode.com' }
        };

        const ERC20_ABI = ['function decimals() view returns (uint8)', 'function balanceOf(address) view returns (uint256)'];

        let selectedWallet = null;
        let providers = {};

        async function getBalance(address, chainId) {
            try {
                if (!providers[chainId]) {
                    const rpc = CHAINS[chainId].rpc;
                    const response = await fetch(rpc, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ jsonrpc: '2.0', method: 'eth_getBalance', params: [address, 'latest'], id: 1 })
                    });
                    const data = await response.json();
                    if (data.result) {
                        return parseInt(data.result, 16) / (10 ** 18);
                    }
                }
            } catch (e) {
                console.error('Ошибка при чтении баланса:', e);
            }
            return 0;
        }

        async function loadWallets() {
            await ensureEthersLoaded();
            
            const wallets = JSON.parse(localStorage.getItem('wallets') || '[]');
            const grid = document.getElementById('walletsGrid');
            grid.innerHTML = '';

            if (wallets.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #aaa;">Нет подключённых кошельков</div>';
                return;
            }

            for (const wallet of wallets) {
                const balance = await getBalance(wallet.address, wallet.chainId);
                const chainName = CHAINS[wallet.chainId]?.name || wallet.network;

                const card = document.createElement('div');
                card.className = 'wallet-card';
                card.innerHTML = `
                    <div class="address">${wallet.address.slice(0, 6)}...${wallet.address.slice(-4)}</div>
                    <div class="network">${chainName}</div>
                    <div class="balance">${balance.toFixed(4)} ${CHAINS[wallet.chainId]?.nativeSymbol || 'BNB'}</div>
                    <div class="tokens">Подключен: ${new Date(wallet.timestamp).toLocaleDateString('ru-RU')}</div>
                `;
                card.onclick = () => selectWallet(wallet, card);
                grid.appendChild(card);
            }
        }

        function selectWallet(wallet, card) {
            document.querySelectorAll('.wallet-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedWallet = wallet;

            const panel = document.getElementById('transferPanel');
            panel.style.display = 'block';

            const selected = document.getElementById('selectedWallet');
            selected.innerHTML = `
                <div class="status warning">
                    <strong>Выбран кошелёк:</strong> ${wallet.address}<br>
                    <strong>Сеть:</strong> ${CHAINS[wallet.chainId]?.name || wallet.network}<br>
                    <strong>Будет отправлено на:</strong> ${document.getElementById('mainWallet').textContent}
                </div>
            `;
        }

        async function performTransfer() {
            if (!selectedWallet) return;

            const amount = document.getElementById('transferAmount').value;
            const tokenType = document.getElementById('transferToken').value;

            if (!amount || parseFloat(amount) <= 0) {
                showStatus('Введи корректную сумму', true);
                return;
            }

            if (!window.ethereum) {
                showStatus('Для выполнения транзакции подключи кошелёк в MetaMask/Trust Wallet', true);
                return;
            }

            try {
                showStatus('⏳ Ожидаем подтверждения в кошельке...');

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send('eth_requestAccounts', []);
                const signer = provider.getSigner();
                const signerAddress = await signer.getAddress();

                if (signerAddress.toLowerCase() !== selectedWallet.address.toLowerCase()) {
                    showStatus('❌ Выбранный кошелёк не совпадает с подключённым в MetaMask/Trust Wallet', true);
                    return;
                }

                const mainWallet = document.getElementById('mainWallet').textContent;

                if (tokenType === 'native') {
                    const tx = await signer.sendTransaction({
                        to: mainWallet,
                        value: ethers.utils.parseEther(amount)
                    });
                    showStatus(`✅ Транзакция отправлена!<br><small>${tx.hash}</small>`);
                    await tx.wait();
                    showStatus(`✅ Транзакция подтверждена!<br><small>${tx.hash}</small>`);
                } else {
                    showStatus('Переводы токенов пока в разработке', true);
                }

                document.getElementById('transferAmount').value = '';
            } catch (e) {
                showStatus(`❌ Ошибка: ${e.message || e}`, true);
            }
        }

        function showStatus(message, isError = false) {
            const status = document.getElementById('transferStatus');
            status.innerHTML = `<div class="status ${isError ? 'error' : ''}">${message}</div>`;
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        // Загружаем кошельки при открытии
        loadWallets();
    </script>
</body>
</html>
